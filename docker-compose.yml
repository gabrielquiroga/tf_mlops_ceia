services:
  # POSTGRES : guarda métricas y parámetros

  postgres:
    image: postgres:15
    container_name: mlops_postgres
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER:-mlflow}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-mlflow}
      POSTGRES_DB: ${PG_DATABASE:-mlflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data # persiste la DB aunque se apageu Docker
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "5432", "-U", "${PG_USER:-mlflow}"]
      interval: 60s
      timeout: 20s
      retries: 3

  # MINIO : guarda modelos y artefactos

  minio:
    image: minio/minio:latest
    container_name: mlops_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data # persiste los modelos guardados
    ports:
      - "${MINIO_PORT:-9000}:9000" # puerto que usa MLflow para guardar artefactos
      - "${MINIO_PORT_UI:-9001}:9001" # puerto de la interfaz web de MinIO
    # Healthcheck para que el cliente que se crea con la imagen minio-init
    # espere a que el servicio esté levantado antes de ejecutarse.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 60s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc
    container_name: mlops_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/${MLFLOW_BUCKET_NAME:-mlflow-artifacts};
      exit 0;
      "

  # MLFLOW SERVER: el servidor

  mlflow:
    image: ghcr.io/mlflow/mlflow
    container_name: mlops_mlflow
    restart: always
    depends_on:
      postgres: # espera a que postgres esté listo
        condition: service_healthy
      minio: # espera a que minio esté listo
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
      MLFLOW_SERVER_DISBALE_SECURITY_MIDDLEWARE: "true"
    command: >
      mlflow server
      --backend-store-uri postgresql://${PG_USER:-mlflow}:${PG_PASSWORD:-mlflow}@postgres:${PG_PORT:-5432}/${PG_DATABASE:-mlflow}
      --default-artifact-root s3://${MLFLOW_BUCKET_NAME:-mlflow-artifacts}
      --host 0.0.0.0
      --port 5000
      --workers 1
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://mlflow:5000 || exit 1
      interval: 60s
      timeout: 10s
      retries: 3

# VOLÚMENES: carpetas persistentes en PC

volumes:
  postgres_data: # donde se guarda la DB
  minio_data: # donde se guardan los modelos
