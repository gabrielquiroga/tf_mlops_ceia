services:
  # POSTGRES : guarda métricas y parámetros

  postgres:
    image: postgres:15
    container_name: mlops_postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data # persiste la DB aunque se apageu Docker
    ports:
      - "5432:5432"

  # MINIO : guarda modelos y artefactos

  minio:
    image: minio/minio
    container_name: mlops_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data # persiste los modelos guardados
    ports:
      - "9000:9000" # puerto que usa MLflow para guardar artefactos
      - "9001:9001" # puerto de la interfaz web de MinIO

  # MLFLOW SERVER: el servidor

  mlflow:
    image: ghcr.io/mlflow/mlflow
    container_name: mlops_mlflow
    depends_on:
      - postgres # espera a que postgres esté listo
      - minio # espera a que minio esté listo
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --artifacts-destination s3://mlflow-artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"

# VOLÚMENES: carpetas persistentes en PC

volumes:
  postgres_data: # donde se guarda la DB
  minio_data: # donde se guardan los modelos
