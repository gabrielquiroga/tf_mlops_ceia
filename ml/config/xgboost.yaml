model:
  name: "stellar-classifier"
  type: "XGBClassifier"

# Features para el modelo
features: ['alpha', 'delta', 'u', 'g', 'r', 'i', 'z', 'redshift']

hyperparameters:
  n_estimators: 471
  learning_rate: 0.01885
  max_depth: 7
  min_child_weight: 4
  gamma: 0.5363
  subsample: 0.7057
  colsample_bytree: 0.6554
  reg_alpha: 0.0386
  reg_lambda: 1.0642
  objective: "multi:softmax"
  num_class: 3
  eval_metric: "mlogloss"
  random_state: 42
  n_jobs: -1

training:
  test_size: 0.2
  random_state: 42
